<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PesenHub Jenggirat — Web Customer Ordering</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK v9 compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 font-sans">
    <header class="bg-amber-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">🥞 PesenHub Jenggirat</h1>
            <span class="text-xs bg-amber-800 px-2 py-1 rounded">Customer Web</span>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-4">
        <!-- Form Pemesanan Pelanggan -->
        <section class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-lg font-bold text-gray-800 mb-3">Form Pemesanan Online</h2>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-sm text-gray-600 font-medium">Nama Pelanggan</label>
                    <input type="text" id="custName" placeholder="Contoh: Yoga Ananda" class="w-full border rounded-lg p-2.5 mt-1 focus:ring-2 focus:ring-amber-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-sm text-gray-600 font-medium">Nomor WhatsApp / HP</label>
                    <input type="tel" id="custPhone" placeholder="08123456789" class="w-full border rounded-lg p-2.5 mt-1 focus:ring-2 focus:ring-amber-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-sm text-gray-600 font-medium">Pilih Menu</label>
                    <select id="menuSelect" class="w-full border rounded-lg p-2.5 mt-1 focus:ring-2 focus:ring-amber-500 outline-none">
                        <option value="Martabak Telur Spesial" data-price="35000">Martabak Telur Spesial - Rp 35.000</option>
                        <option value="Terang Bulan Coklat Keju" data-price="30000">Terang Bulan Coklat Keju - Rp 30.000</option>
                        <option value="Terang Bulan Pandan Jagung" data-price="28000">Terang Bulan Pandan Jagung - Rp 28.000</option>
                        <option value="Es Teh Manis Jumbo" data-price="5000">Es Teh Manis Jumbo - Rp 5.000</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-gray-600 font-medium">Metode Pembayaran</label>
                    <div class="flex gap-4 mt-1">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="payMethod" value="QRIS" checked class="text-amber-600">
                            <span>QRIS (Digital)</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="payMethod" value="Tunai" class="text-amber-600">
                            <span>Bayar Tunai di Outlet</span>
                        </label>
                    </div>
                </div>
                <div>
                    <label class="block text-sm text-gray-600 font-medium">Catatan Pesanan</label>
                    <textarea id="custNotes" placeholder="Contoh: Tidak pakai daun bawang, kuah dipisah" class="w-full border rounded-lg p-2.5 mt-1 text-sm focus:ring-2 focus:ring-amber-500 outline-none"></textarea>
                </div>
                <button onclick="kirimPesananWeb()" id="btnKirim" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-lg shadow transition">
                    Kirim Pesanan ke Outlet
                </button>
            </div>
        </section>

        <!-- Status Realtime Pesanan Aktif -->
        <section class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-lg font-bold text-gray-800 mb-2">Pantau Status Pesanan Realtime</h2>
            <p class="text-xs text-gray-500 mb-3">Pesanan yang dikirim melalui halaman ini otomatis terhubung dan tampil di aplikasi Android kasir.</p>
            <div id="orderList" class="space-y-2">
                <p class="text-sm text-gray-400 italic">Memuat data dari Firestore...</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
